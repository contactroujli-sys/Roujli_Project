services:
  - type: web
    name: roujli-backend
    env: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
